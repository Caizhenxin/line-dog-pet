<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../../">
<meta charset="utf-8">
<title>桌宠彩蛋</title>
<style>
  html, body{
    width:100%; height:100%; margin:0; overflow:hidden;
    background:transparent; pointer-events:none;
  }
  #egg{
    position:fixed; bottom:-20vmax; width:138vmax; height:138vmax;
    max-width:none; max-height:none; object-fit:contain;
    opacity:0; transform-origin:left bottom;
    animation:egg-in 1.48s cubic-bezier(.18,.82,.22,1) both;
  }
  body.pup #egg{ left:-20vmax; }
  body.jin #egg{ right:-20vmax; transform-origin:right bottom; }
  @keyframes egg-in{
    0%   { opacity:0; transform:translate(0, 20vmax) scale(.68); }
    16%  { opacity:1; }
    68%  { opacity:1; transform:translate(0, 0) scale(1.06); }
    100% { opacity:0; transform:translate(0, -5vmax) scale(1.13); }
  }
</style>
</head>
<body class="pup">
  <img id="egg" src="assets/easter/easter-pup.gif" alt="">
  <script>
    (function(){
      var pet2 = /(?:^|[?&])pet=2(?:&|$)/.test(location.search);
      document.body.className = pet2 ? 'pup' : 'jin';
      document.getElementById('egg').src = pet2
        ? 'assets/easter/easter-pup.gif'
        : 'assets/easter/easter-jin.gif';
    })();
  </script>
</body>
</html>
